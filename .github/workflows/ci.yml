name: CI
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-pip python3-gi python3-pil gir1.2-gtk-4.0 gir1.2-gdkpixbuf-2.0 xvfb xauth dbus-x11 x11-xkb-utils libxtst6 mpv ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run test:terminal
      - run: npm run test:native
      - name: Capture offline native UI
        run: GDK_BACKEND=x11 GSK_RENDERER=cairo xvfb-run -a -s '-screen 0 1400x1000x24' dbus-run-session -- /usr/bin/python3 scripts/capture-demo.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quietchat-offline-preview
          path: docs/images/quietchat-desktop.png
          retention-days: 7
